<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Top Magazine Header -->
  <rect x="0" y="0" width="1080" height="240" fill="url(#topGrad)" opacity="0.9"/>
  <text x="540" y="110" font-family="'Syne', 'Impact', sans-serif" font-size="82" font-weight="900" fill="#D4FF00" text-anchor="middle" letter-spacing="8">AURALENS</text>
  <text x="540" y="155" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">ISSUE 2026 // GEN Z SPECIAL EDITION</text>
  <line x1="120" y1="180" x2="960" y2="180" stroke="#00F5FF" stroke-width="3" stroke-dasharray="10 5"/>

  <!-- Left Side Badges -->
  <rect x="40" y="320" width="260" height="60" rx="30" fill="#FF2E93"/>
  <text x="170" y="360" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">★ DRIP SCORE: 98 ★</text>

  <rect x="40" y="400" width="220" height="50" rx="25" fill="rgba(0,0,0,0.6)" stroke="#00F5FF" stroke-width="2"/>
  <text x="150" y="435" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#00F5FF" text-anchor="middle">#CYBER_POP</text>

  <!-- Cyber Viewfinder Corners -->
  <path d="M 60 140 L 60 80 L 120 80" stroke="#D4FF00" stroke-width="8" fill="none"/>
  <path d="M 1020 140 L 1020 80 L 960 80" stroke="#D4FF00" stroke-width="8" fill="none"/>
  <path d="M 60 1780 L 60 1840 L 120 1840" stroke="#00F5FF" stroke-width="8" fill="none"/>
  <path d="M 1020 1780 L 1020 1840 L 960 1840" stroke="#00F5FF" stroke-width="8" fill="none"/>

  <!-- Center Crosshair Target -->
  <circle cx="540" cy="960" r="40" stroke="rgba(212, 255, 0, 0.4)" stroke-width="2" fill="none"/>
  <line x1="540" y1="900" x2="540" y2="940" stroke="#D4FF00" stroke-width="2"/>
  <line x1="540" y1="980" x2="540" y2="1020" stroke="#D4FF00" stroke-width="2"/>
  <line x1="480" y1="960" x2="520" y2="960" stroke="#D4FF00" stroke-width="2"/>
  <line x1="560" y1="960" x2="600" y2="960" stroke="#D4FF00" stroke-width="2"/>

  <!-- Bottom Barcode & Footer -->
  <rect x="0" y="1720" width="1080" height="200" fill="url(#bottomGrad)" opacity="0.95"/>
  <text x="80" y="1810" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">FEEL THE AURA // SGN 2026</text>
  <text x="80" y="1850" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="600" fill="#D4FF00">POWERED BY GOOGLE AI &amp; LUMI PERSONA</text>

  <!-- Barcode Right -->
  <g transform="translate(820, 1760)">
    <rect x="0" y="0" width="6" height="80" fill="#FFFFFF"/>
    <rect x="12" y="0" width="12" height="80" fill="#FFFFFF"/>
    <rect x="30" y="0" width="4" height="80" fill="#FFFFFF"/>
    <rect x="40" y="0" width="16" height="80" fill="#FFFFFF"/>
    <rect x="64" y="0" width="8" height="80" fill="#FFFFFF"/>
    <rect x="80" y="0" width="4" height="80" fill="#FFFFFF"/>
    <rect x="92" y="0" width="14" height="80" fill="#FFFFFF"/>
    <rect x="114" y="0" width="10" height="80" fill="#FFFFFF"/>
    <rect x="132" y="0" width="18" height="80" fill="#FFFFFF"/>
    <rect x="158" y="0" width="6" height="80" fill="#FFFFFF"/>
    <rect x="172" y="0" width="12" height="80" fill="#FFFFFF"/>
  </g>

  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A0A0F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
