<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Top Magazine Header -->
  <rect x="0" y="0" width="1080" height="200" fill="url(#topGrad)" opacity="0.9"/>
  <text x="540" y="95" font-family="'Syne', 'Impact', sans-serif" font-size="78" font-weight="900" fill="#D4FF00" text-anchor="middle" letter-spacing="8">AURALENS</text>
  <text x="540" y="140" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">ISSUE 2026 // CYBERPOP SPECIAL EDITION</text>
  <line x1="120" y1="165" x2="960" y2="165" stroke="#00F5FF" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- Cyber Viewfinder Corners -->
  <path d="M 60 140 L 60 80 L 120 80" stroke="#D4FF00" stroke-width="6" fill="none"/>
  <path d="M 1020 140 L 1020 80 L 960 80" stroke="#D4FF00" stroke-width="6" fill="none"/>
  <path d="M 60 1780 L 60 1840 L 120 1840" stroke="#00F5FF" stroke-width="6" fill="none"/>
  <path d="M 1020 1780 L 1020 1840 L 960 1840" stroke="#00F5FF" stroke-width="6" fill="none"/>

  <!-- Bottom Barcode & Footer -->
  <rect x="0" y="1720" width="1080" height="200" fill="url(#bottomGrad)" opacity="0.95"/>
  <text x="80" y="1810" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">FEEL THE AURA // SGN 2026</text>
  <text x="80" y="1850" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="600" fill="#D4FF00">POWERED BY GOOGLE AI &amp; LUMI PERSONA</text>

  <!-- Barcode Right -->
  <g transform="translate(820, 1760)">
    <rect x="0" y="0" width="6" height="80" fill="#FFFFFF"/>
    <rect x="12" y="0" width="12" height="80" fill="#FFFFFF"/>
    <rect x="30" y="0" width="4" height="80" fill="#FFFFFF"/>
    <rect x="40" y="0" width="16" height="80" fill="#FFFFFF"/>
    <rect x="64" y="0" width="8" height="80" fill="#FFFFFF"/>
    <rect x="80" y="0" width="4" height="80" fill="#FFFFFF"/>
    <rect x="92" y="0" width="14" height="80" fill="#FFFFFF"/>
    <rect x="114" y="0" width="10" height="80" fill="#FFFFFF"/>
    <rect x="132" y="0" width="18" height="80" fill="#FFFFFF"/>
    <rect x="158" y="0" width="6" height="80" fill="#FFFFFF"/>
    <rect x="172" y="0" width="12" height="80" fill="#FFFFFF"/>
  </g>

  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A0A0F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
