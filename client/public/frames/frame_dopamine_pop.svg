  <defs>
    <linearGradient id="popGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="33%" stop-color="#D4FF00"/>
      <stop offset="66%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
