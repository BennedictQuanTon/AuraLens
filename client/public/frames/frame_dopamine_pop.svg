<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Colorful Y2K Border Frame -->
  <rect x="30" y="30" width="1020" height="1860" rx="40" fill="none" stroke="url(#popGrad)" stroke-width="18"/>
  <rect x="55" y="55" width="970" height="1810" rx="30" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="15 10"/>

  <!-- Top Bubble Badges -->
  <rect x="80" y="90" width="340" height="70" rx="35" fill="#FF2E93"/>
  <text x="250" y="135" font-family="'Syne', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">💖 SO KAWAII 💖</text>

  <rect x="680" y="90" width="320" height="70" rx="35" fill="#D4FF00"/>
  <text x="840" y="135" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#111827" text-anchor="middle">★ VIBE CHECK 100% ★</text>

  <!-- Bottom Y2K Badges -->
  <rect x="80" y="1740" width="360" height="70" rx="35" fill="#00F5FF"/>
  <text x="260" y="1785" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#111827" text-anchor="middle">✨ LUMI APPROVED ✨</text>

  <!-- Cute Pixel Stickers in corners -->
  <circle cx="980" cy="1770" r="45" fill="#FF2E93"/>
