<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Film Borders -->
  <rect x="0" y="0" width="100" height="1920" fill="#18181B"/>
  <rect x="980" y="0" width="100" height="1920" fill="#18181B"/>
  
  <!-- Sprocket Holes Left -->
  <g fill="#FFFFFF">
    <rect x="25" y="100" width="50" height="70" rx="10"/>
    <rect x="25" y="250" width="50" height="70" rx="10"/>
    <rect x="25" y="400" width="50" height="70" rx="10"/>
    <rect x="25" y="550" width="50" height="70" rx="10"/>
    <rect x="25" y="700" width="50" height="70" rx="10"/>
    <rect x="25" y="850" width="50" height="70" rx="10"/>
    <rect x="25" y="1000" width="50" height="70" rx="10"/>
    <rect x="25" y="1150" width="50" height="70" rx="10"/>
    <rect x="25" y="1300" width="50" height="70" rx="10"/>
    <rect x="25" y="1450" width="50" height="70" rx="10"/>
    <rect x="25" y="1600" width="50" height="70" rx="10"/>
    <rect x="25" y="1750" width="50" height="70" rx="10"/>
  </g>

  <!-- Sprocket Holes Right -->
  <g fill="#FFFFFF">
    <rect x="1005" y="100" width="50" height="70" rx="10"/>
    <rect x="1005" y="250" width="50" height="70" rx="10"/>
    <rect x="1005" y="400" width="50" height="70" rx="10"/>
    <rect x="1005" y="550" width="50" height="70" rx="10"/>
    <rect x="1005" y="700" width="50" height="70" rx="10"/>
    <rect x="1005" y="850" width="50" height="70" rx="10"/>
    <rect x="1005" y="1000" width="50" height="70" rx="10"/>
    <rect x="1005" y="1150" width="50" height="70" rx="10"/>
    <rect x="1005" y="1300" width="50" height="70" rx="10"/>
    <rect x="1005" y="1450" width="50" height="70" rx="10"/>
    <rect x="1005" y="1600" width="50" height="70" rx="10"/>
    <rect x="1005" y="1750" width="50" height="70" rx="10"/>
  </g>

  <!-- Orange Film Datestamp -->
  <text x="140" y="180" font-family="'Space Grotesk', 'Courier', monospace" font-size="42" font-weight="700" fill="#FFA500" letter-spacing="4">'26  8  24  19:45</text>
  <text x="140" y="1820" font-family="'Space Grotesk', 'Courier', monospace" font-size="34" font-weight="700" fill="#FFA500" letter-spacing="6">KODAK GOLD 400 - EXP 24</text>
  <text x="750" y="1820" font-family="'Space Grotesk', monospace" font-size="34" font-weight="700" fill="#FFA500">ISO 400 // 35MM</text>
</svg>
