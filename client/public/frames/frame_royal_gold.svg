<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Vintage Gold Border -->
  <rect x="40" y="40" width="1000" height="1840" fill="none" stroke="#D4AF37" stroke-width="6"/>
  <rect x="55" y="55" width="970" height="1810" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Ornate Corner Motifs -->
  <g stroke="#D4AF37" stroke-width="3" fill="none">
    <path d="M 40 120 C 80 120, 120 80, 120 40"/>
    <path d="M 1040 120 C 1000 120, 960 80, 960 40"/>
    <path d="M 40 1800 C 80 1800, 120 1840, 120 1880"/>
    <path d="M 1040 1800 C 1000 1800, 960 1840, 960 1880"/>
  </g>

  <!-- Top Gold Header -->
  <text x="540" y="140" font-family="'Didot', 'Times New Roman', serif" font-size="48" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="14">A U R A L E N S</text>
  <text x="540" y="180" font-family="'Space Grotesk', serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">EST. SAIGON 2026</text>

  <!-- Bottom Wax Seal Text -->
  <circle cx="540" cy="1780" r="50" fill="#8B0000" stroke="#D4AF37" stroke-width="3"/>
  <text x="540" y="1790" font-family="'Didot', serif" font-size="34" font-weight="900" fill="#D4AF37" text-anchor="middle">AL</text>
  <text x="540" y="1860" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="500" fill="#D4AF37" text-anchor="middle" letter-spacing="4">OLD MONEY LUXURY SELECTION</text>
</svg>
